[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosft"
version = "0.1.0"
description = "An agentic research service for supervised fine-tuning data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6", "httpx>=0.27", "aiohttp>=3.10", "tensorboard>=2.12", "datasets>=3", "huggingface-hub>=0.26", "transformers==4.57.3", "numpy<2", "tqdm"]

[project.scripts]
autosft = "autosft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autosft*"]

[tool.setuptools.package-data]
"autosft.data" = ["templates/*.jinja"]
"autosft.agents" = ["prompts/*.md"]
"autosft.benchmarks" = ["templates/*.jinja"]
"autosft.synthesis" = ["_internal/prompts/*.md"]

